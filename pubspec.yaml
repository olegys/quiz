name: quiz_battle
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  flutter_svg: ^2.1.0
  flextras: ^1.0.0
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  flutter_screenutil: ^6.0.0-alpha.1
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  path_provider: ^2.1.5
  flutter_smart_dialog: ^4.9.8+9
  slang: ^4.7.3
  slang_flutter: ^4.7.0
  flutter_keyboard_visibility: ^6.0.0
  share_plus: ^11.0.0
  lottie: ^3.2.0
  stop_watch_timer: ^3.2.2
  flutter_inset_shadow: ^2.0.3
  in_app_review: ^2.0.10
  package_info_plus: ^8.3.0
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  dio_smart_retry: ^6.0.0
  collection: ^1.18.0
  html_unescape: ^2.0.0
  internet_connection_checker_plus: ^2.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  freezed: ^2.5.7
  flutter_gen_runner: ^5.10.0
  slang_build_runner: ^4.7.0

flutter_gen:
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: NoplatoDemo
      fonts:
        - asset: assets/fonts/Noplato-Mono.ttf
          weight: 400
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700